name: Vídeo noticia - Al Atlético le salen las cuentas

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar edge-tts, Pillow y ffmpeg
        timeout-minutes: 4
        run: |
          # ffmpeg desde imageio-ffmpeg: apt-get se queda colgado en el runner
          pip install edge-tts imageio-ffmpeg pillow
          FF=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          echo "FF=$FF" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$FF" -version | head -1

      - name: Generar el vídeo
        timeout-minutes: 12
        run: python3 scripts/video_noticia.py salida/atleti-cuentas.mp4

      - name: Comprobar el resultado
        run: |
          "$FF" -hide_banner -i salida/atleti-cuentas.mp4 2>&1 | grep -E "Duration|Stream" || true
          ls -la salida/atleti-cuentas.mp4

      - name: Subir el vídeo
        uses: actions/upload-artifact@v4
        with:
          name: video-atleti-cuentas
          path: salida/atleti-cuentas.mp4
