name: Video previa Bayern
on: workflow_dispatch
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar
        run: pip install edge-tts imageio-ffmpeg pillow numpy
      - name: Crear imagenes y video
        run: |
          mkdir w && cd w
          cat > previa.py <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import glob
          def find(n): return [f for f in glob.glob('/usr/share/fonts/**/*.ttf',recursive=True) if f.endswith('/'+n)][0]
          FB, FR = find('LiberationSans-Bold.ttf'), find('LiberationSans-Regular.ttf')
          B=lambda s:ImageFont.truetype(FB,s); R=lambda s:ImageFont.truetype(FR,s)
          W,H=1920,1080
          RED=(203,53,43); WHITE=(255,255,255); GREY=(200,204,220); CARD=(255,255,255,20); GREEN=(46,190,110); AMB=(240,175,45)
          import urllib.request, urllib.parse, json, io
          UA={'User-Agent':'DiarioColchonero/1.0 (diariocolchonero.com)'}
          def _get(u):
              return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read()
          def _commons(q):
              try:
                  u='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','generator':'search','gsrsearch':q,'gsrnamespace':6,'gsrlimit':5,'prop':'imageinfo','iiprop':'url','iiurlwidth':500,'format':'json'})
                  pg=sorted(json.loads(_get(u))['query']['pages'].values(),key=lambda p:p.get('index',9))
                  for p in pg:
                      t=p['title'].lower()
                      if 'logo' in t or 'escudo' in t or 'crest' in t or 'badge' in t:
                          return Image.open(io.BytesIO(_get(p['imageinfo'][0]['thumburl']))).convert('RGBA')
              except Exception as e: print('escudo no descargado',q,e)
              return None
          def _respaldo(ini,c1,c2):
              s=400; im=Image.new('RGBA',(s,s),(0,0,0,0)); d=ImageDraw.Draw(im)
              pts=[(40,30),(360,30),(360,200),(200,380),(40,200)]
              d.polygon(pts,fill=c1,outline=WHITE); d.line(pts+[pts[0]],fill=WHITE,width=10)
              d.polygon([(200,30),(360,30),(360,200),(200,380)],fill=c2)
              d.text((200,190),ini,font=B(130),fill=WHITE,anchor="mm",stroke_width=5,stroke_fill=(20,20,20))
              return im
          import os
          # Escudos guardados en el repositorio (limpios y con fondo transparente); si falta alguno,
          # se busca en Wikimedia Commons y, si tampoco, se dibuja el de respaldo.
          LOCAL={'atm':'../public/escudos/escudoB.png','bay':'../public/escudos/bayern.png'}
          def _local(k):
              return Image.open(LOCAL[k]).convert('RGBA') if os.path.isfile(LOCAL[k]) else None
          ESC={}
          for k,q,ini,c1,c2 in [('atm','Atlético de Madrid escudo logo','ATM',RED,(20,40,110)),('bay','FC Bayern München logo','FCB',(220,30,60),(40,90,200))]:
              ESC[k]=_local(k) or _commons(q) or _respaldo(ini,c1,c2)
          def pegar(im,k,cx,cy,size):
              e=ESC[k].copy(); e.thumbnail((size,size)); im.paste(e,(int(cx-e.width/2),int(cy-e.height/2)),e)
          from PIL import ImageFilter as _F
          def _fondo_premium():
              import math
              # Degradado diagonal azul noche -> granate, con brillos, franjas rojiblancas muy sutiles y viñeta
              g=Image.new('RGB',(W,H)); px=g.load()
              for y in range(0,H,2):
                  for x in range(0,W,2):
                      k=(x/W*0.55+y/H*0.45)
                      c=(int(8+40*k),int(12+4*k),int(30+8*(1-k)))
                      px[x,y]=c
              g=g.resize((W//2,H//2)).resize((W,H),Image.BILINEAR)
              capa=Image.new('RGBA',(W,H),(0,0,0,0)); dc=ImageDraw.Draw(capa)
              for i in range(-H, W, 120):  # franjas diagonales
                  dc.polygon([(i,H),(i+40,H),(i+40+H*0.6,0),(i+H*0.6,0)],fill=(255,255,255,7) if (i//120)%2 else (203,53,43,10))
              g=Image.alpha_composite(g.convert('RGBA'),capa)
              luz=Image.new('RGBA',(W,H),(0,0,0,0)); dl=ImageDraw.Draw(luz)
              dl.ellipse([-300,-350,900,450],fill=(203,53,43,90)); dl.ellipse([1200,500,2300,1400],fill=(40,80,200,80)); dl.ellipse([700,-200,1300,250],fill=(255,255,255,25))
              g=Image.alpha_composite(g,luz.filter(_F.GaussianBlur(160)))
              vin=Image.new('L',(W,H),0); ImageDraw.Draw(vin).ellipse([-W*0.25,-H*0.35,W*1.25,H*1.35],fill=255)
              vin=vin.filter(_F.GaussianBlur(220)); negro=Image.new('RGBA',(W,H),(0,0,0,255))
              return Image.composite(g,negro,vin)
          FONDO=_fondo_premium().convert("RGB")
          def base(titulo, sub=None, n=None, esc=('atm','bay')):
              im=FONDO.copy(); d=ImageDraw.Draw(im,'RGBA')
              d.rounded_rectangle([60,64,72,150 if sub else 130],6,fill=RED)
              d.text((96,70),titulo,font=B(74),fill=WHITE)
              if sub: d.text((98,166),sub,font=R(36),fill=GREY)
              d.rectangle([0,H-58,W,H],fill=(0,0,0,150)); d.rectangle([0,H-58,W,H-55],fill=RED)
              d.text((90,H-29),"DIARIO COLCHONERO · diariocolchonero.com",font=B(26),fill=WHITE,anchor="lm")
              d.text((W-90,H-29),"Atlético – Bayern · Champions · 3 nov · 21:00",font=R(26),fill=GREY,anchor="rm")
              for i,k in enumerate(reversed(esc)): pegar(im,k,W-130-i*150,110,120)
              return im,d
          def card(d,x,y,w,h,big,small,color=WHITE):
              d.rounded_rectangle([x,y,x+w,y+h],24,fill=CARD,outline=(255,255,255,45),width=2)
              d.text((x+w//2,y+h*0.42),big,font=B(int(h*0.36)),fill=color,anchor="mm")
              d.text((x+w//2,y+h*0.80),small,font=R(30),fill=GREY,anchor="mm")
          def pitch(d,x0,y0,w,h):
              d.rounded_rectangle([x0,y0,x0+w,y0+h],18,fill=(20,96,62,235),outline=(220,230,225),width=4)
              d.line([(x0,y0+h//2),(x0+w,y0+h//2)],fill=(220,230,225),width=3)
              r=90; d.ellipse([x0+w//2-r,y0+h//2-r,x0+w//2+r,y0+h//2+r],outline=(220,230,225),width=3)
              for yy,s in ((y0,1),(y0+h,-1)):
                  d.rectangle([x0+w*0.28,min(yy,yy+s*140),x0+w*0.72,max(yy,yy+s*140)],outline=(220,230,225),width=3)
          def jug(d,x,y,nombre,color=RED,nota=None):
              d.ellipse([x-30,y-30,x+30,y+30],fill=color,outline=WHITE,width=4)
              d.text((x,y+52),nombre,font=B(30),fill=WHITE,anchor="mm")
              if nota: d.text((x,y+84),nota,font=R(24),fill=AMB,anchor="mm")
          def once(d,x0,y0,w,h,filas,color):
              # filas: de portería (abajo) a delantera (arriba): lista de listas de (nombre,nota)
              n=len(filas)
              for i,f in enumerate(filas):
                  y=y0+h-95-i*(h-210)/(n-1)
                  for j,item in enumerate(f):
                      nom,nota=(item if isinstance(item,tuple) else (item,None))
                      x=x0+w*(j+1)/(len(f)+1)
                      jug(d,x,y,nom,color,nota)
          out=[]
          def save(im,name): im.convert("RGB").save(name); out.append(name)

          BAYC=(220,30,60)
          def fila(d,y,t1,t2,etq=None,col=RED,h=135,big=None):
              d.rounded_rectangle([130,y,1790,y+h],24,fill=CARD)
              d.text((190,y+h*0.36),t1,font=B(46),fill=WHITE,anchor="lm"); d.text((190,y+h*0.74),t2,font=R(30),fill=GREY,anchor="lm")
              if etq:
                  d.rounded_rectangle([1370,y+30,1740,y+h-30],20,fill=col); d.text((1555,y+h/2),etq,font=B(32),fill=WHITE if col!=AMB else (30,20,10),anchor="mm")
              if big: d.text((1720,y+h/2),big,font=B(84),fill=RED,anchor="rm")
          # 1 portada
          im,d=base("PREVIA ATLÉTICO – BAYERN","Champions League · Fase de liga · Jornada 4")
          pegar(im,'atm',560,370,270); pegar(im,'bay',1360,370,270); d.text((W//2,370),"VS",font=B(110),fill=RED,anchor="mm")
          d.text((W//2,590),"MARTES 3 DE NOVIEMBRE · 21:00",font=B(76),fill=WHITE,anchor="mm")
          d.text((W//2,670),"Riyadh Air Metropolitano",font=R(50),fill=GREY,anchor="mm")
          card(d,360,740,360,230,"9","partidos sin perder",RED); card(d,780,740,360,230,"16.º","en Champions · 4 pts",WHITE); card(d,1200,740,360,230,"5","puntos del Bayern",WHITE)
          save(im,"01_portada.png")
          # 2 momento Atleti
          im,d=base("CÓMO LLEGA EL ATLÉTICO","Lanzado en Liga, irregular en Europa",esc=('atm',))
          xs=[130,720,1310]
          card(d,xs[0],290,480,300,"9","partidos sin perder (8V · 1E)",RED); card(d,xs[1],290,480,300,"7","victorias seguidas en Liga",WHITE); card(d,xs[2],290,480,300,"2.º","a 2 puntos del Barça",WHITE)
          card(d,xs[0],640,480,300,"1-1-1","Champions: V · E · D",AMB); card(d,xs[1],640,480,300,"4","puntos en Europa",WHITE); card(d,xs[2],640,480,300,"0-2","ante el Levante el sábado",WHITE)
          save(im,"02_momento.png")
          # 3 la defensa en Europa
          im,d=base("LA DEFENSA EN EUROPA","El punto débil: porterías a cero en Champions con Simeone",esc=('atm',))
          d.rounded_rectangle([130,290,920,640],24,fill=CARD); d.rounded_rectangle([1000,290,1790,640],24,fill=CARD)
          d.text((525,400),"55 %",font=B(130),fill=GREEN,anchor="mm"); d.text((525,520),"en sus primeros 69 partidos",font=R(38),fill=GREY,anchor="mm")
          d.text((1395,400),"18 %",font=B(130),fill=RED,anchor="mm"); d.text((1395,520),"en los últimos 65 (solo 12)",font=R(38),fill=GREY,anchor="mm")
          fila(d,700,"Pero en casa siempre marca","20 partidos seguidos de Champions viendo puerta en el Metropolitano",big="20")
          save(im,"03_defensa_europa.png")
          # 4 historial
          im,d=base("EL BAYERN, EN CASA, NO GANA","Historial en Champions")
          d.rounded_rectangle([130,290,1790,560],24,fill=CARD)
          d.text((W//2,370),"El Atlético nunca ha perdido en casa ante el Bayern en Champions",font=R(46),fill=GREY,anchor="mm")
          d.text((W//2,470),"2 VICTORIAS · 1 EMPATE",font=B(96),fill=RED,anchor="mm")
          fila(d,610,"2016 · Semifinal","El golazo de Saúl en el Calderón y el pase a la final",etq="1-0",col=RED)
          fila(d,775,"1974 · Final de la Copa de Europa","La espina: el Bayern ganó el desempate en Bruselas",etq="LA ESPINA",col=GREY)
          save(im,"04_historial.png")
          # 5 bajas Atleti
          im,d=base("PARTE DE BAJAS: ATLÉTICO","Última hora antes del Bayern",esc=('atm',))
          for i,(a,b,c,col) in enumerate([("Johnny Cardoso","Lesión · tercer partido seguido fuera","BAJA",RED),("Hjulmand","Sancionado por su expulsión en Europa","SANCIONADO",RED),("Cuti Romero","¿Ahora ante el Bayern o guardarlo para el Barça?","DUDA",AMB),("Koke","Sigue apurando su recuperación","DUDA",AMB)]):
              fila(d,290+i*165,a,b,etq=c,col=col)
          save(im,"05_bajas_atleti.png")
          # 6 once Atleti
          im,d=base("ONCE PROBABLE DEL ATLÉTICO","Según Flashscore · 4-4-2",esc=('atm',))
          pitch(d,560,230,800,760)
          once(d,560,230,800,760,[["Oblak"],["Llorente","Pubill","Hancko","Grimaldo"],["Giuliano","Barrios","Baena","Lookman"],["J. David","Julián"]],RED)
          d.text((200,450),"Alternativas",font=B(40),fill=WHITE)
          for k,t in enumerate(["Cuti Romero","Kang-in Lee","Sørloth","Le Normand"]): d.text((200,510+k*52),"· "+t,font=R(38),fill=GREY)
          save(im,"06_once_atleti.png")
          # 7 hombres clave Atleti
          im,d=base("LOS HOMBRES CLAVE DEL ATLETI","Tres nombres para tumbar al Bayern",esc=('atm',))
          card(d,130,300,480,320,"26","goles de Julián en 45 partidos de Champions",RED); card(d,720,300,480,320,"91 %","pases adelante bajo presión de Barrios",WHITE); card(d,1310,300,480,320,"5 de 6","duelos de Grimaldo vs Bayern sin perder",WHITE)
          d.rounded_rectangle([130,680,1790,880],24,fill=CARD)
          d.text((W//2,750),"Julián, a un gol de Lautaro",font=B(60),fill=WHITE,anchor="mm")
          d.text((W//2,830),"tercer máximo goleador argentino de la historia de la Champions",font=R(40),fill=GREY,anchor="mm")
          save(im,"07_clave_atleti.png")
          # 8 cómo llega el Bayern
          im,d=base("CÓMO LLEGA EL BAYERN","Con Aaron Danks en el banquillo: Kompany se recupera",esc=('bay',))
          card(d,130,290,480,300,"5","puntos · uno más que el Atleti",BAYC); card(d,720,290,480,300,"3-3 · 2-2","empates ante Viking y Arsenal",WHITE); card(d,1310,290,480,300,"11","goles en sus 3 últimos partidos",WHITE)
          d.rounded_rectangle([130,640,1790,900],24,fill=CARD)
          d.text((W//2,730),"El equipo más vertical de esta Champions",font=B(60),fill=WHITE,anchor="mm")
          d.text((W//2,820),"50 pases que rompen líneas y acaban en remate · el que más",font=R(42),fill=GREY,anchor="mm")
          save(im,"08_bayern.png")
          # 9 Harry Kane
          im,d=base("OJO A HARRY KANE","A un partido del récord de Cristiano",esc=('bay',))
          d.rounded_rectangle([130,290,1790,640],24,fill=CARD)
          d.text((W//2,430),"10",font=B(220),fill=BAYC,anchor="mm")
          d.text((W//2,580),"partidos seguidos de Champions marcando con el Bayern",font=R(46),fill=GREY,anchor="mm")
          fila(d,700,"Si le marca a Oblak…","Iguala el récord de Cristiano Ronaldo en 2018: 11 partidos seguidos",big="11")
          save(im,"09_kane.png")
          # 10 bajas y once Bayern
          im,d=base("BAJAS Y ONCE DEL BAYERN","Según Flashscore · 4-2-3-1",esc=('bay',))
          pitch(d,560,230,800,760)
          once(d,560,230,800,760,[["Urbig"],["Laimer","Upamecano","Kim","Davies"],["Kimmich","Pavlović"],["Olise","Bischof","Karl"],["Kane"]],(200,30,60))
          d.text((200,430),"Bajas",font=B(40),fill=WHITE)
          for k,t in enumerate(["Gnabry","Saibari"]): d.text((200,490+k*52),"· "+t,font=R(38),fill=GREY)
          d.text((200,650),"Duda",font=B(40),fill=WHITE); d.text((200,710),"· Olise",font=R(38),fill=AMB)
          save(im,"10_once_bayern.png")
          # 11 probabilidades
          im,d=base("¿QUIÉN ES FAVORITO?","Probabilidades según las casas de apuestas")
          x=160; tot=1600
          for n,v,c in [("Atlético",33,RED),("Empate",24,(120,120,140)),("Bayern",43,BAYC)]:
              w=tot*v/100; d.rectangle([x,420,x+w-6,640],fill=c)
              d.text((x+w/2-3,500),f"{v}%",font=B(110),fill=WHITE,anchor="mm"); d.text((x+w/2-3,600),n,font=B(40),fill=WHITE,anchor="mm"); x+=w
          pegar(im,"atm",230,330,130); pegar(im,"bay",1690,330,130)
          d.text((W//2,780),"Ligero favoritismo del Bayern… en un estadio donde nunca ha ganado",font=R(46),fill=GREY,anchor="mm")
          save(im,"11_probabilidades.png")
          # 12 claves
          im,d=base("LAS CLAVES DEL PARTIDO")
          for i,(n,a,b) in enumerate([("1","Apagar a Kane","Cortarle los balones antes de que llegue al área"),("2","La salida de Barrios","Su precisión bajo presión, para romper la del Bayern"),("3","El Metropolitano","Lleno y con la afición como jugador número 12"),("4","Julián","El gol de las grandes noches")]):
              y=270+i*180
              d.rounded_rectangle([130,y,1790,y+150],24,fill=CARD)
              d.ellipse([170,y+25,270,y+125],fill=RED); d.text((220,y+75),n,font=B(64),fill=WHITE,anchor="mm")
              d.text((320,y+52),a,font=B(54),fill=WHITE,anchor="lm"); d.text((320,y+108),b,font=R(36),fill=GREY,anchor="lm")
          save(im,"12_claves.png")
          # 13 dónde verlo
          im,d=base("DÓNDE VERLO","Martes 3 de noviembre · 21:00")
          d.rounded_rectangle([260,360,1660,560],24,fill=CARD)
          d.text((340,460),"M+ Liga de Campeones",font=B(70),fill=WHITE,anchor="lm"); d.text((1580,460),"21:00",font=B(70),fill=RED,anchor="rm")
          d.text((W//2,680),"Riyadh Air Metropolitano · lleno hasta la bandera",font=R(50),fill=GREY,anchor="mm")
          d.text((W//2,800),"Crónica y resumen en Diario Colchonero",font=R(50),fill=GREY,anchor="mm")
          save(im,"13_donde_verlo.png")
          # hoja de contacto
          cs=Image.new('RGB',(1920,1620),(10,10,14))
          for i,n in enumerate(out):
              t=Image.open(n).resize((640,360)); cs.paste(t,((i%3)*640,(i//3)*405))
          cs.save("contacto.png"); print(len(out))
          # Portada del canal para abrir y cerrar el vídeo: la imagen entera sobre un fondo
          # hecho con ella misma ampliada y desenfocada.
          from PIL import ImageFilter, ImageEnhance
          canal=Image.open('../videos/imagenes/canal-diario-colchonero.jpg').convert('RGB')
          fondo=canal.resize((int(canal.width*H/canal.height),H)).crop((0,0,W,H)).filter(ImageFilter.GaussianBlur(30))
          fondo=ImageEnhance.Brightness(fondo).enhance(0.5)
          c2=canal.copy(); c2.thumbnail((W,H)); fondo.paste(c2,((W-c2.width)//2,(H-c2.height)//2))
          fondo.save("14_suscribete.png")
          Image.open('../videos/imagenes/portada-previa-bayern.jpg').convert('RGB').resize((W,H),Image.LANCZOS).save("00_portada.png")
          PYEOF
          cat > montar.py <<'PYEOF'
          import os, re, subprocess, asyncio
          FF = os.environ.get("FF", "ffmpeg")
          FAKE = os.environ.get("FAKE") == "1"
          OUT = "salida"; os.makedirs(OUT, exist_ok=True)
          SEG = [
          ("00_portada.png", ""),
          ("01_portada.png", """Buenas, colchoneros. Llega una de esas noches grandes de Champions: el Atlético de Madrid recibe al Bayern de Múnich este martes, a las nueve de la noche, en un Metropolitano lleno hasta la bandera. Es la cuarta jornada de la fase de liga, y el Bayern llega solo un punto por delante. Repasamos cómo llegan los dos equipos, las bajas, los onces y las claves. Quédate hasta el final."""),
          ("02_momento.png", """El Atlético llega lanzado. Suma nueve partidos sin perder, con ocho victorias y un empate, y siete triunfos seguidos en Liga, el último por cero a dos en Valencia ante el Levante. Es segundo, a dos puntos del Barcelona. Pero en Europa el arranque ha sido irregular: una victoria, un empate y una derrota. Cuatro puntos, decimosexto, y la necesidad de sumar para no complicarse el camino."""),
          ("03_defensa_europa.png", """Y aquí está la gran preocupación. En sus primeros sesenta y nueve partidos de Champions con Simeone, el Atlético dejaba la portería a cero en el cincuenta y cinco por ciento de los encuentros. En los últimos sesenta y cinco, solo lo ha conseguido doce veces, un dieciocho por ciento. La solidez de antes, en Europa, ya no es la misma. La buena noticia es arriba: el equipo lleva veinte partidos seguidos de Champions marcando en casa."""),
          ("04_historial.png", """Y el Metropolitano es territorio hostil para el Bayern. El Atlético nunca ha perdido en casa contra los alemanes en la Champions: dos victorias y un empate. Todos recordamos aquella semifinal de dos mil dieciséis, con el golazo de Saúl que acabó llevándonos a la final. Y en la memoria queda también la espina de mil novecientos setenta y cuatro, la final de la Copa de Europa que se decidió en el desempate de Bruselas."""),
          ("05_bajas_atleti.png", """En la enfermería, Johnny Cardoso sigue fuera por lesión y se perderá su tercer partido seguido. Hjulmand no estará, porque cumple sanción por su expulsión en Europa. Y la gran duda es Cuti Romero: Simeone tiene que decidir si lo arriesga ante el Bayern o lo guarda para el Barcelona del domingo. Koke, por su parte, sigue apurando su recuperación."""),
          ("06_once_atleti.png", """El once probable, según Flashscore, sería este. En la portería, Oblak. En defensa, Llorente, Pubill, Hancko y Grimaldo. En el centro del campo, Giuliano, Barrios, Baena y Lookman. Y arriba, Julián Álvarez y Jonathan David. Desde el banquillo esperan el Cuti, si no sale de inicio, Kang In Li y Sorloth."""),
          ("07_clave_atleti.png", """Hay tres nombres clave. Pablo Barrios, que en esta Champions ha completado el noventa y uno por ciento de sus pases hacia delante bajo presión intensa. Grimaldo, que no ha perdido en cinco de sus seis duelos ante el Bayern en Europa. Y Julián Álvarez, la gran referencia: veintiséis goles en cuarenta y cinco partidos de Champions. Está a un solo gol de igualar a Lautaro Martínez como tercer máximo goleador argentino de la historia del torneo."""),
          ("08_bayern.png", """Enfrente, un Bayern que llega con cinco puntos, uno más que el Atlético, pero tras dos empates seguidos en Europa: tres a tres ante el Viking y dos a dos ante el Arsenal. Lo dirige de forma temporal Aaron Danks, mientras Vincent Kompany se recupera, y quiere evitar tres empates seguidos en la Champions por primera vez en casi dos décadas. Su pegada sigue intacta: once goles en sus tres últimos partidos. Y es el equipo más vertical de esta Champions, con cincuenta pases que rompen líneas y acaban en remate."""),
          ("09_kane.png", """Y ojo a Harry Kane. El delantero inglés ha marcado en cada uno de sus últimos diez partidos de Champions con el Bayern. Si le hace un gol a Oblak en el Metropolitano, igualará el récord histórico de Cristiano Ronaldo en dos mil dieciocho: once partidos seguidos marcando en la competición. Pararle será la primera misión de la defensa rojiblanca."""),
          ("10_once_bayern.png", """El Bayern llega tocado. Gnabry y Saibari se retiraron con molestias en el último partido de liga y están descartados, y Olise también terminó tocado, aunque apunta a jugar. Su once probable: Urbig en la portería; Laimer, Upamecano, Kim y Davies en defensa; Kimmich y Pavlović en el medio; Olise, Bischof y Karl por detrás; y Harry Kane arriba."""),
          ("11_probabilidades.png", """¿Y quién es favorito? Las casas de apuestas dan un ligero favoritismo al Bayern: alrededor de un cuarenta y tres por ciento de opciones de victoria alemana, un veinticuatro de empate y un treinta y tres para el Atlético. Pero ojo, porque el Bayern nunca ha ganado en casa del Atlético en la Champions."""),
          ("12_claves.png", """Estas son las claves. Primera: apagar a Kane, cortando los balones antes de que llegue al área. Segunda: la salida de Barrios, para romper la presión alemana. Tercera: el Metropolitano. Giuliano lo dijo esta semana: la afición tiene que ser el jugador número doce. Y cuarta: Julián, el hombre de las grandes noches."""),
          ("13_donde_verlo.png", """El partido se juega este martes a las nueve de la noche en el Metropolitano, y lo podrás ver en Movistar Plus Liga de Campeones. Nosotros lo seguiremos en Diario Colchonero, con la crónica y el resumen. Y tú, ¿cómo lo ves? Déjanos tu pronóstico en comentarios. ¡Aúpa Atleti!"""),
          ("14_suscribete.png", """Suscríbete a nuestro canal de YouTube."""),
          ]
          def run(cmd): subprocess.run(cmd, check=True, capture_output=True)
          def dur(p):
              r = subprocess.run([FF, "-i", p], capture_output=True, text=True).stderr
              m = re.search(r"Duration: (\d+):(\d+):([\d.]+)", r)
              return int(m[1])*3600 + int(m[2])*60 + float(m[3])
          def tts(t, p):
              if FAKE:
                  run([FF,"-y","-f","lavfi","-i",f"anullsrc=r=22050:cl=mono:d={len(t)/float(os.environ.get('RAPIDO','14'))}",p]); return
              import edge_tts
              # Tono algo más grave con el propio edge-tts (sin estirar el audio, que la hacía robótica).
              # Cada bloque se lee seguido: los saltos de línea del guion metían parones largos.
              t = " ".join(t.split())
              asyncio.run(edge_tts.Communicate(t, "es-ES-AlvaroNeural", rate="+16%", pitch="-6Hz").save(p))
          partes = []
          for i, (img, txt) in enumerate(SEG):
              raw, fx, seg = f"{OUT}/r{i}.mp3", f"{OUT}/f{i}.wav", f"{OUT}/s{i:02d}.mp4"
              if not txt.strip():  # imagen sin locución: 2,5 s solo con música
                  run([FF,"-y","-f","lavfi","-i","anullsrc=r=44100:cl=mono","-t","2.5",fx])
              else:
                  tts(txt, raw)
                  # Recorta las pausas largas entre frases a 0,15 s y deja solo 0,12 s entre imágenes
                  run([FF,"-y","-i",raw,"-af","aresample=44100,silenceremove=start_periods=1:start_threshold=-45dB:stop_periods=-1:stop_duration=0.18:stop_threshold=-45dB:stop_silence=0.15,bass=g=3:f=120,acompressor=threshold=0.1:ratio=2.5:attack=20:release=250,apad=pad_dur=0.12",fx])
              d = dur(fx); n = int(d*25)+1
              # Movimiento variado: alterna acercarse y alejarse, con un ligero desplazamiento lateral
              z = f"1+0.12*on/{n}" if i % 2 == 0 else f"1.12-0.12*on/{n}"
              dx = ("+" if i % 4 < 2 else "-") + f"(iw/zoom/2)*0.06*(on/{n}-0.5)"
              fc = f"[0:v]scale=2400:1350,zoompan=z='{z}':x='iw/2-(iw/zoom/2){dx}':y='ih/2-(ih/zoom/2)':d=1:s=1920x1080:fps=25,format=yuv420p[v]"
              run([FF,"-y","-loop","1","-framerate","25","-i",img,"-i",fx,"-filter_complex",fc,"-map","[v]","-map","1:a","-t",f"{d:.2f}","-c:v","libx264","-crf","27","-preset","veryfast","-c:a","aac","-b:a","160k",seg])
              partes.append(seg); print("segmento", i, round(d,1), "s", flush=True)
          with open(f"{OUT}/lista.txt","w") as f:
              for p in partes: f.write("file '"+os.path.basename(p)+"'\n")
          run([FF,"-y","-f","concat","-safe","0","-i",f"{OUT}/lista.txt","-c","copy",f"{OUT}/voz.mp4"])
          # Música de fondo y un "whoosh" en cada cambio de imagen
          import numpy as np, wave, glob
          SR = 44100
          total = dur(f"{OUT}/voz.mp4"); N = int(total * SR); t = np.arange(N) / SR
          rng = np.random.default_rng(31)
          def env(x, a, d): return np.minimum(x / a, 1) * np.exp(-x * d)
          cancion = sorted(glob.glob("../assets/musica/*.mp3") + glob.glob("../assets/musica/*.m4a"))
          if cancion:
              crudo = subprocess.run([FF, "-loglevel", "error", "-stream_loop", "-1", "-i", cancion[0], "-t", f"{total:.2f}", "-ac", "1", "-ar", str(SR), "-f", "s16le", "-"], capture_output=True, check=True).stdout
              musica = np.frombuffer(crudo, "<i2").astype(float) / 32768; musica = np.pad(musica, (0, max(N - len(musica), 0)))[:N]
          else:
              # Ambiente: colchón de acordes lentos, bajo largo, brillo suave y murmullo de estadio
              acordes = [(220.0, 261.63, 329.63), (174.61, 220.0, 261.63), (261.63, 329.63, 392.0), (196.0, 246.94, 293.66)]
              dur_ac = 6.0
              musica = np.zeros(N)
              for c in range(int(total / dur_ac) + 2):
                  a0 = int(c * dur_ac * SR); a1 = min(int((c + 1.6) * dur_ac * SR), N)  # solapan para fundirse
                  if a0 >= N: break
                  tt = np.arange(a1 - a0) / SR; L_ = (a1 - a0) / SR
                  envol = np.sin(np.pi * np.clip(tt / L_, 0, 1)) ** 2
                  ac = acordes[c % 4]
                  pad = sum(np.sin(2 * np.pi * f * tt + 0.3 * np.sin(2 * np.pi * 0.2 * tt)) + 0.5 * np.sin(2 * np.pi * f * 1.003 * tt) + 0.25 * np.sin(4 * np.pi * f * tt) for f in ac)
                  bajo = np.sin(2 * np.pi * ac[0] / 2 * tt)
                  brillo = sum(np.sin(2 * np.pi * f * 2 * tt) for f in ac) * (0.5 + 0.5 * np.sin(2 * np.pi * 0.5 * tt))
                  musica[a0:a1] += envol * (0.05 * pad + 0.06 * bajo + 0.012 * brillo)
              ruido = rng.standard_normal(N)
              espectro = np.fft.rfft(ruido); fr = np.fft.rfftfreq(N, 1 / SR); espectro[(fr < 250) | (fr > 1600)] = 0
              grada = np.fft.irfft(espectro, N); grada /= (np.max(np.abs(grada)) or 1)
              musica += 0.06 * grada * (0.8 + 0.2 * np.sin(2 * np.pi * 0.07 * t))
          musica *= np.minimum(t / 2, 1) * np.minimum((total - t) / 3, 1)
          musica = 0.22 * musica / (np.max(np.abs(musica)) or 1)
          # Whoosh: ruido que sube y baja de tono al cambiar de imagen
          cortes = []; acum = 0.0
          for p in partes[:-1]:
              acum += dur(p); cortes.append(acum)
          lw = int(0.6 * SR); xw = np.arange(lw) / lw
          ruido = rng.standard_normal(lw); filtrado = np.zeros(lw); y = 0.0
          for k in range(lw):
              alfa = 0.02 + 0.25 * np.sin(np.pi * xw[k]); y += alfa * (ruido[k] - y); filtrado[k] = y
          whoosh = filtrado / np.max(np.abs(filtrado)) * np.sin(np.pi * xw) ** 2 * 0.18
          for c in cortes:
              a = max(int((c - 0.3) * SR), 0); b = min(a + lw, N); musica[a:b] += whoosh[:b - a]
          with wave.open(f"{OUT}/musica.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes((np.clip(musica, -1, 1) * 32767).astype("<i2").tobytes())
          # Mezcla: la música se agacha cuando habla el narrador
          run([FF, "-y", "-i", f"{OUT}/voz.mp4", "-i", f"{OUT}/musica.wav", "-filter_complex",
               "[0:a]asplit[v][clave];[1:a][clave]sidechaincompress=threshold=0.04:ratio=3:attack=30:release=400[m];[v][m]amix=inputs=2:normalize=0,alimiter=limit=0.95[a]",
               "-map", "0:v", "-map", "[a]", "-c:v", "copy", "-c:a", "aac", "-b:a", "160k", f"{OUT}/previa_atletico_bayern.mp4"])
          print("OK", dur(f"{OUT}/previa_atletico_bayern.mp4"))
          PYEOF
          python previa.py
          export FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          python montar.py
      - uses: actions/upload-artifact@v4
        with:
          name: previa-bayern
          path: |
            w/salida/previa_atletico_bayern.mp4
            w/*.png
