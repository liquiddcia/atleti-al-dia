name: Vídeo libro Sombras de Aranjuez
# Short promocional del libro: portada a pantalla completa, voz paranormal, ambiente tenebroso y efectos

on:
  workflow_dispatch:
  push:
    branches: [claude/upbeat-meitner-6q6qho]
    paths:
      - .github/workflows/video-libro.yml
      - scripts/promo_libro.py

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar edge-tts, Pillow, NumPy y ffmpeg
        run: |
          pip install edge-tts imageio-ffmpeg pillow numpy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generar el vídeo
        run: python3 scripts/promo_libro.py salida
      - name: Comprobar el resultado
        run: |
          FF=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FF" -hide_banner -i salida/sombras_de_aranjuez_shorts.mp4 2>&1 | grep -E "Duration|Stream" || true
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: sombras-de-aranjuez
          path: |
            salida/sombras_de_aranjuez_shorts.mp4
            salida/voz.mp3
