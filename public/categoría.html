<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atleti al Día — Diario Colchonero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #D2122E; --red-dark: #9A0B21; --ink: #14151A; --cream: #F5F3EE;
    --paper: #FFFFFF; --navy: #10203D; --gold: #C79A3C; --grey: #55565C; --teal: #0E6B5C; --plum: #8C2F6B;
    --line: rgba(20,21,26,0.13);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Barlow',Arial,sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .headline-font{ font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:800; }
  .topbar{ background:var(--ink); color:#EDEDED; font-family:'Barlow Condensed',sans-serif; font-size:12.5px; font-weight:500; display:flex; justify-content:space-between; align-items:center; padding:6px 20px; letter-spacing:.02em; }
  .topbar span.dot{ color:var(--red); margin:0 6px; }

  .masthead-banner{ width:100%; background:var(--navy); border-bottom:5px solid var(--red); }
  .banner-img{ width:100%; height:auto; display:block; }
  .strapline-bar{ background:var(--paper); text-align:center; padding:8px 12px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; color:var(--grey); letter-spacing:.04em; border-bottom:1px solid var(--line); }

  .navmenu{ background:var(--paper); border-bottom:1px solid var(--line); }
  .navmenu-inner{ max-width:1080px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:center; gap:2px; padding:2px 12px; }
  .navmenu a{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase; color:var(--ink); padding:10px 14px; border-bottom:3px solid transparent; }
  .navmenu a:hover{ color:var(--red-dark); }
  .navmenu a.activo{ color:var(--red-dark); border-bottom-color:var(--red); }

  main{ max-width:1080px; margin:0 auto; padding:22px 20px 60px; }
  .cat-head{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .cat-head .ribbon{ margin:0; }
  .cat-head h1.headline-font{ font-size:clamp(22px,3.6vw,32px); margin:0; text-transform:uppercase; }

  .ribbon{ display:inline-block; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:13px; letter-spacing:.03em; background:var(--red); color:#fff; padding:4px 10px 5px; border-radius:2px; text-transform:uppercase; }
  .ribbon.champions{ background:var(--navy); } .ribbon.previa{ background:var(--grey); } .ribbon.fichajes{ background:var(--gold); color:#1c1608; } .ribbon.clasificacion{ background:var(--ink); } .ribbon.filial{ background:var(--teal); } .ribbon.femenino{ background:var(--plum); }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .card{ background:var(--paper); border:1px solid var(--line); display:flex; flex-direction:column; }
  .card-img{ height:140px; position:relative; }
  .card-body{ padding:14px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .tag{ align-self:flex-start; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:.02em; padding:3px 8px 4px; border-radius:2px; color:#fff; text-transform:uppercase; }
  .tag.liga{ background:var(--red); } .tag.champions{ background:var(--navy); }
  .tag.previa{ background:var(--grey); } .tag.fichajes{ background:var(--gold); color:#1c1608; } .tag.clasificacion{ background:var(--ink); } .tag.filial{ background:var(--teal); } .tag.femenino{ background:var(--plum); }
  .card h3.headline-font{ font-size:19px; line-height:1.08; margin:0; text-transform:uppercase; }
  .card p.teaser{ font-size:14.5px; color:#33343a; margin:0; line-height:1.4; }
  .card .leer-mas{ margin-top:auto; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; color:var(--red-dark); padding-top:6px; border-top:1px dashed var(--line); background:none; border:none; text-align:left; cursor:pointer; }
  .estado{ font-family:'Barlow Condensed',sans-serif; color:var(--grey); padding:40px 0; text-align:center; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,10,14,.6); display:none; align-items:flex-start; justify-content:center; padding: 5vh 16px; z-index:50; overflow-y:auto; }
  .modal-overlay.abierto{ display:flex; }
  .modal-box{ background:var(--paper); max-width:640px; width:100%; margin-bottom:40px; }
  .modal-img{ height:200px; }
  .modal-content{ padding:22px 26px 28px; }
  .modal-content h2{ font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:26px; text-transform:uppercase; line-height:1.08; margin:10px 0 14px; }
  .modal-content .cuerpo p{ font-size:16px; line-height:1.6; color:#22232b; margin:0 0 12px; }
  .modal-close{ float:right; background:none; border:none; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; color:var(--grey); cursor:pointer; padding:4px 0; }

  footer{ max-width:1080px; margin:0 auto; padding:10px 20px 50px; color:var(--grey); font-size:13px; }
  footer .note{ border-top:1px solid var(--line); padding-top:18px; }
  footer b{ color:var(--ink); }

  @media (max-width:860px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

  <div class="topbar">
    <span id="fecha-hoy">—</span>
    <span><span class="dot">•</span>EDICIÓN DIGITAL<span class="dot">•</span><span id="hora-actualizado">—</span></span>
  </div>

  <div class="masthead-banner">
    <img src="/banner.png" alt="Atlético al Día" class="banner-img">
  </div>
  <div class="strapline-bar">EL DIARIO COLCHONERO — NOTICIAS DEL ATLÉTICO DE MADRID</div>

  <nav class="navmenu">
    <div class="navmenu-inner" id="navmenu-inner">
      <a href="index.html">Portada</a>
      <a href="categoria.html?cat=liga" data-cat="liga">Liga</a>
      <a href="categoria.html?cat=champions" data-cat="champions">Champions</a>
      <a href="categoria.html?cat=previa" data-cat="previa">Previa</a>
      <a href="categoria.html?cat=fichajes" data-cat="fichajes">Mercado</a>
      <a href="categoria.html?cat=clasificacion" data-cat="clasificacion">Clasificación</a>
      <a href="categoria.html?cat=filial" data-cat="filial">Filial</a>
      <a href="categoria.html?cat=femenino" data-cat="femenino">Femenino</a>
    </div>
  </nav>

  <main>
    <div class="cat-head">
      <span class="ribbon" id="cat-ribbon">Categoría</span>
      <h1 class="headline-font" id="cat-titulo">Cargando…</h1>
    </div>
    <div class="grid" id="grid">
      <p class="estado">Cargando noticias…</p>
    </div>
  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-img" id="modal-img"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close">Cerrar ✕</button>
        <span class="ribbon" id="modal-tag"></span>
        <h2 id="modal-titulo"></h2>
        <div class="cuerpo" id="modal-cuerpo"></div>
      </div>
    </div>
  </div>

  <script>
    const ETIQUETAS = { liga:"Liga", champions:"Champions", previa:"Previa", fichajes:"Mercado", clasificacion:"Clasificación", filial:"Filial", femenino:"Femenino" };

    const params = new URLSearchParams(window.location.search);
    const CATEGORIA = params.get("cat") || "liga";

    function ilustracionCategoria(cat){
      const imagenes = {
        liga: "/imagenes/liga.png",
        champions: "/imagenes/champions.png",
        previa: "/imagenes/previa.png",
        fichajes: "/imagenes/mercado.png",
        clasificacion: "/imagenes/clasificacion.png",
        filial: "/imagenes/filial.png",
        femenino: "/imagenes/femenino.png"
      };
      const src = imagenes[cat] || imagenes.liga;
      return `<img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">`;
    }

    function formatearFecha(iso){
      if(!iso) return "";
      return new Date(iso).toLocaleString("es-ES", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
    }

    let NOTICIAS_ACTUALES = [];

    function abrirModal(indice){
      const n = NOTICIAS_ACTUALES[indice];
      if(!n) return;
      document.getElementById("modal-img").innerHTML = ilustracionCategoria(n.categoria);
      const tag = document.getElementById("modal-tag");
      tag.textContent = ETIQUETAS[n.categoria] || n.categoria;
      tag.className = "ribbon " + n.categoria;
      document.getElementById("modal-titulo").textContent = n.titular;
      const cuerpo = n.cuerpo || n.resumen;
      document.getElementById("modal-cuerpo").innerHTML = cuerpo.split(/\n+/).map(p => `<p>${p}</p>`).join("");
      document.getElementById("modal-overlay").classList.add("abierto");
    }
    function cerrarModal(){ document.getElementById("modal-overlay").classList.remove("abierto"); }
    document.getElementById("modal-close").addEventListener("click", cerrarModal);
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if(e.target.id === "modal-overlay") cerrarModal();
    });

    async function cargar(){
      document.getElementById("fecha-hoy").textContent =
        new Date().toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long", year:"numeric" }).toUpperCase();

      // Resalta en el menú la categoría activa
      const link = document.querySelector(`.navmenu a[data-cat="${CATEGORIA}"]`);
      if(link) link.classList.add("activo");

      document.getElementById("cat-titulo").textContent = ETIQUETAS[CATEGORIA] || CATEGORIA;
      const ribbon = document.getElementById("cat-ribbon");
      ribbon.textContent = ETIQUETAS[CATEGORIA] || CATEGORIA;
      ribbon.className = "ribbon " + CATEGORIA;

      try{
        const r = await fetch("/api/noticias");
        const datos = await r.json();
        NOTICIAS_ACTUALES = datos.noticias.filter(n => n.categoria === CATEGORIA);
        document.getElementById("hora-actualizado").textContent =
          "ACTUALIZADO " + (formatearFecha(datos.actualizado) || "—");

        const grid = document.getElementById("grid");

        if(!NOTICIAS_ACTUALES.length){
          grid.innerHTML = '<p class="estado">Todavía no hay noticias guardadas en esta categoría.</p>';
          return;
        }

        grid.innerHTML = NOTICIAS_ACTUALES.map((n, i) => `
          <div class="card">
            <div class="card-img">${ilustracionCategoria(n.categoria)}</div>
            <div class="card-body">
              <span class="tag ${n.categoria}">${ETIQUETAS[n.categoria] || n.categoria}</span>
              <h3 class="headline-font">${n.titular}</h3>
              <p class="teaser">${n.resumen}</p>
              <button class="leer-mas" onclick="abrirModal(${i})">Leer más →</button>
            </div>
          </div>
        `).join("");

      }catch(e){
        document.getElementById("grid").innerHTML = '<p class="estado">No se pudieron cargar las noticias. Revisa que /api/noticias esté desplegado.</p>';
      }
    }

    cargar();
  </script>
</body>
</html>
