 <!--
      CARA A CARA — esto es manual a propósito: no hay una fuente de datos
      automática fiable para alineaciones/convocatorias, así que se edita
      aquí a mano antes de cada partido importante. Cambia estos valores
      y el rival/hora/escudos se actualizan solos abajo.
    -->
    <section class="matchup" id="matchup" data-equipo-local="Alavés"
      data-escudo-local="/escudos/escudoA.png" data-equipo-visitante="Atlético de Madrid"
      data-escudo-visitante="/escudos/escudoB.png" data-cuando="Sábado 10 de octubre, 16:15h · Mendizorroza">
      <!-- El contenido real se rellena por JS a partir de los data-* de arriba -->
    </section>

    <div id="hero-slot"></div>

    <div class="grid" id="grid">
      <p class="estado">Cargando noticias…</p>
    </div>

  </main>
  <footer style="max-width:1080px;margin:0 auto;padding:10px 20px 50px;color:#55565C;font-size:13px;text-align:center;border-top:1px solid rgba(20,21,26,.13)">
    <p>Diario Colchonero · Independiente, no afiliado al Atlético de Madrid.</p>
    <p>📲 Síguenos: <a href="https://whatsapp.com/channel/0029VbDayGCF1YlZa2aj5j0J" target="_blank" rel="noopener">Canal de WhatsApp</a> · <a href="https://t.me/diariocolchonero" target="_blank" rel="noopener">Canal de Telegram</a></p>
    <p><a href="/sobre-nosotros.html">Quiénes somos</a> · <a href="/privacidad.html">Privacidad</a> · <a href="/cookies.html">Cookies</a> · <a href="/aviso-legal.html">Aviso legal</a> · <a href="/contacto.html">Contacto</a></p>
  </footer>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-img" id="modal-img"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close">Cerrar ✕</button>
        <span class="ribbon" id="modal-tag"></span>
        <h2 id="modal-titulo"></h2>
        <p id="modal-fecha" style="font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--grey); margin:0 0 16px;"></p>
        <div class="cuerpo" id="modal-cuerpo"></div>
        <div id="modal-video"></div>

        <div class="acciones" style="margin-top:18px;">
          <button class="btn-like" id="modal-like">❤ 0</button>
          <button class="btn-compartir" id="modal-compartir">Compartir</button>
        </div>

        <div class="comentarios-section">
          <h4>Comentarios</h4>
          <div id="modal-comentarios-lista"><p class="estado" style="padding:10px 0;">Cargando comentarios…</p></div>
          <form class="form-comentario" id="comentario-form">
            <input type="text" id="comentario-nombre" placeholder="Tu nombre" maxlength="40" required>
            <textarea id="comentario-texto" placeholder="Escribe un comentario…" maxlength="500" required></textarea>
            <button type="submit">Publicar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ETIQUETAS = { liga:"Liga", champions:"Champions", previa:"Previa", fichajes:"Mercado", clasificacion:"Clasificación", filial:"Filial", femenino:"Femenino" };
    // La portada solo muestra las categorías del primer equipo. Filial y Femenino
    // tienen su propia página (categoria.html) enlazada desde el menú.
    const CATEGORIAS_PORTADA = ["liga", "champions", "previa", "fichajes", "clasificacion"];
    // Máximo de noticias en portada (garantizando al menos 1 de cada sección que tenga noticias)
    const TOTAL_PORTADA = 8;

    function dibujarMatchup(d){
      const el = document.getElementById("matchup");
      el.innerHTML = `
        <div class="matchup-head">
          <span class="ribbon previa" style="margin:0;">Próximo partido</span>
          <span class="matchup-when">${d.cuando}</span>
        </div>
        <div class="matchup-teams">
          <div class="team"><img src="${d.escudoLocal}" class="crest" alt="${d.local}"><span class="team-name">${d.local}</span></div>
          <div class="vs-mark">VS</div>
          <div class="team"><img src="${d.escudoVisitante}" class="crest" alt="${d.visitante}"><span class="team-name">${d.visitante}</span></div>
        </div>
      `;
    }

    // Primero pinta los datos manuales (respaldo) y después los sustituye
    // por el siguiente partido real del calendario, si se puede cargar.
    function pintarMatchup(){
      const el = document.getElementById("matchup");
      dibujarMatchup({
        local: el.dataset.equipoLocal, visitante: el.dataset.equipoVisitante,
        escudoLocal: el.dataset.escudoLocal, escudoVisitante: el.dataset.escudoVisitante,
        cuando: el.dataset.cuando
      });
      matchupAutomatico();
    }

    function esAtleti(nombre){
      const n = String(nombre || "").toLowerCase();
      return n.includes("atlético") || n.includes("atletico") || n.includes("atleti");
    }

    async function matchupAutomatico(){
      try{
        const r = await fetch("/api/clasificacion");
        const datos = await r.json();
        const tabla = (datos.calendario && datos.calendario.tabla) || [];
        const limite = Date.now() - 3 * 60 * 60 * 1000; // un partido en juego sigue contando
        const proximos = tabla
          .filter(p => p.estado !== "FINISHED" && p.estado !== "POSTPONED" && p.estado !== "CANCELLED" && new Date(p.fecha).getTime() > limite)
          .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
        const p = proximos[0];
        if(!p) return;
        const f = new Date(p.fecha);
        const dia = f.toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long", timeZone:"Europe/Madrid" });
        const hora = f.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Madrid" });
        const diaTxt = dia.charAt(0).toUpperCase() + dia.slice(1);
        dibujarMatchup({
          local: esAtleti(p.local) ? "Atlético de Madrid" : p.local,
          visitante: esAtleti(p.visitante) ? "Atlético de Madrid" : p.visitante,
          escudoLocal: esAtleti(p.local) ? "/escudos/escudoB.png" : (p.localEscudo || "/escudos/escudoA.png"),
          escudoVisitante: esAtleti(p.visitante) ? "/escudos/escudoB.png" : (p.visitanteEscudo || "/escudos/escudoA.png"),
          cuando: `${diaTxt}, ${hora}h` + (p.competicion ? ` · ${p.competicion}` : "")
        });
      }catch(e){}
    }

    function ilustracionCategoria(cat, url){
      const imagenes = {
        liga: "/imagenes/liga.png",
        champions: "/imagenes/champions.png",
        previa: "/imagenes/previa.png",
        fichajes: "/imagenes/mercado.png",
        clasificacion: "/imagenes/clasificacion.png",
        filial: "/imagenes/filial.png",
        femenino: "/imagenes/femenino.png"
      };
      const src = url || imagenes[cat] || imagenes.liga;
      const respaldo = imagenes[cat] || imagenes.liga;
      return `<img src="${src}" alt="" onerror="this.onerror=null;this.src='${respaldo}'" style="width:100%;height:100%;object-fit:cover;display:block;">`;
    }

    function formatearFecha(iso){
      if(!iso) return "";
      return new Date(iso).toLocaleString("es-ES", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
    }

    // ---------- Vídeo (YouTube) ----------
    function idYoutube(url){
      if(!url) return null;
      const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
      return m ? m[1] : null;
    }
    function videoHtml(url){
      const id = idYoutube(url);
      if(!id) return "";
      return `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Vídeo" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` +
             `<a class="video-link" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">▶ Ver en YouTube</a>`;
    }

    // ---------- Me gusta ----------
    function idsLikeados(){
      try { return JSON.parse(localStorage.getItem("atleti_likes") || "[]"); }
      catch(e){ return []; }
    }
    function guardarLikeados(arr){
      try { localStorage.setItem("atleti_likes", JSON.stringify(arr)); } catch(e){}
    }
    function haDadoLike(id){ return idsLikeados().includes(id); }

    function botonLikeHtml(n){
      const activo = haDadoLike(n.id) ? " activo" : "";
      return `<button class="btn-like${activo}" data-like-id="${n.id}" onclick="event.stopPropagation(); toggleLike(${n.id})">❤ ${n.likes || 0}</button>`;
    }

    async function toggleLike(id){
      const likeados = idsLikeados();
      const yaLike = likeados.includes(id);
      const accion = yaLike ? "quitar" : "dar";
      try{
        const r = await fetch("/api/like", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, accion })
        });
        const datos = await r.json();
        if(!r.ok) throw new Error(datos.error || "Error al dar me gusta");

        const nuevaLista = yaLike ? likeados.filter(x => x !== id) : [...likeados, id];
        guardarLikeados(nuevaLista);

        const n = NOTICIAS_ACTUALES.find(x => x.id === id);
        if(n) n.likes = datos.likes;

        document.querySelectorAll(`[data-like-id="${id}"]`).forEach(el => {
          el.textContent = "❤ " + datos.likes;
          el.classList.toggle("activo", !yaLike);
        });
      }catch(e){
        console.error("Error al dar me gusta:", e);
      }
    }

    // ---------- Compartir ----------
    function compartir(n){
      const url = `${location.origin}/api/noticia?id=${n.id}`;
      if(navigator.share){
        navigator.share({ title: n.titular, text: n.titular + " — Diario Colchonero", url }).catch(() => {});
      } else if(navigator.clipboard){
        navigator.clipboard.writeText(url).then(() => alert("Enlace copiado al portapapeles")).catch(() => prompt("Copia este enlace:", url));
      } else {
        prompt("Copia este enlace:", url);
      }
    }
    function compartirPorId(id){
      const n = NOTICIAS_ACTUALES.find(x => x.id === id);
      if(n) compartir(n);
    }

    // ---------- Comentarios ----------
    async function cargarComentarios(id){
      const cont = document.getElementById("modal-comentarios-lista");
      cont.innerHTML = '<p class="estado" style="padding:10px 0;">Cargando comentarios…</p>';
      try{
        const r = await fetch(`/api/comentarios?noticia_id=${id}`);
        const datos = await r.json();
        const lista = datos.comentarios || [];
        if(!lista.length){
          cont.innerHTML = '<p class="estado" style="padding:10px 0;">Sé el primero en comentar.</p>';
          return;
        }
        cont.innerHTML = lista.map(() => `
          <div class="comentario">
            <div class="comentario-cabeza">
              <span class="comentario-nombre"></span>
              <span class="comentario-fecha"></span>
            </div>
            <p class="comentario-texto"></p>
          </div>
        `).join("");
        const bloques = cont.querySelectorAll(".comentario");
        bloques.forEach((bloque, i) => {
          bloque.querySelector(".comentario-nombre").textContent = lista[i].nombre;
          bloque.querySelector(".comentario-fecha").textContent = formatearFecha(lista[i].creado_en);
          bloque.querySelector(".comentario-texto").textContent = lista[i].texto;
        });
      }catch(e){
        cont.innerHTML = '<p class="estado" style="padding:10px 0;">No se pudieron cargar los comentarios.</p>';
      }
    }

    async function enviarComentario(id){
      const inputNombre = document.getElementById("comentario-nombre");
      const inputTexto = document.getElementById("comentario-texto");
      const nombre = inputNombre.value.trim();
      const texto = inputTexto.value.trim();
      if(!nombre || !texto) return;

      const ultimoEnvio = Number(localStorage.getItem("atleti_ultimo_comentario") || 0);
      if(Date.now() - ultimoEnvio < 20000){
        alert("Espera unos segundos antes de comentar de nuevo.");
        return;
      }

      try{
        const r = await fetch("/api/comentarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ noticia_id: id, nombre, texto })
        });
        if(!r.ok) throw new Error("Error al enviar");
        localStorage.setItem("atleti_ultimo_comentario", String(Date.now()));
        inputTexto.value = "";
        cargarComentarios(id);
      }catch(e){
        alert("No se pudo enviar el comentario. Inténtalo de nuevo.");
      }
    }

    let NOTICIAS_ACTUALES = [];

    function abrirModal(indice){
      const n = NOTICIAS_ACTUALES[indice];
      if(!n) return;
      document.getElementById("modal-img").innerHTML = ilustracionCategoria(n.categoria, n.imagen_url);
      const tag = document.getElementById("modal-tag");
      tag.textContent = ETIQUETAS[n.categoria] || n.categoria;
      tag.className = "ribbon " + n.categoria;
      document.getElementById("modal-titulo").textContent = n.titular;
      document.getElementById("modal-fecha").textContent = formatearFecha(n.publicado_en);
      const cuerpo = n.cuerpo || n.resumen;
      document.getElementById("modal-cuerpo").innerHTML = cuerpo.split(/\n+/).map(p => `<p>${p}</p>`).join("");
      document.getElementById("modal-video").innerHTML = videoHtml(n.video_url);

      const likeBtn = document.getElementById("modal-like");
      likeBtn.dataset.likeId = n.id;
      likeBtn.textContent = "❤ " + (n.likes || 0);
      likeBtn.classList.toggle("activo", haDadoLike(n.id));
      likeBtn.onclick = () => toggleLike(n.id);

      document.getElementById("modal-compartir").onclick = () => compartir(n);

      document.getElementById("comentario-nombre").value = "";
      document.getElementById("comentario-texto").value = "";
      cargarComentarios(n.id);
      document.getElementById("comentario-form").onsubmit = (e) => {
        e.preventDefault();
        enviarComentario(n.id);
      };

      document.getElementById("modal-overlay").classList.add("abierto");
    }
    function cerrarModal(){ document.getElementById("modal-overlay").classList.remove("abierto"); }
    document.getElementById("modal-close").addEventListener("click", cerrarModal);
    document.getElementById("modal-overlay").addEventListener("click", (e) => {
      if(e.target.id === "modal-overlay") cerrarModal();
    });

    // Abrir/cerrar el desplegable de Liga (tap-friendly, sirve también en móvil)
    document.querySelectorAll(".nav-dropdown-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const dropdown = btn.closest(".nav-dropdown");
        const estabaAbierto = dropdown.classList.contains("abierto");
        document.querySelectorAll(".nav-dropdown.abierto").forEach(d => d.classList.remove("abierto"));
        if(!estabaAbierto) dropdown.classList.add("abierto");
      });
    });
    document.addEventListener("click", () => {
      document.querySelectorAll(".nav-dropdown.abierto").forEach(d => d.classList.remove("abierto"));
    });

    async function cargar(){
      pintarMatchup();
      document.getElementById("fecha-hoy").textContent =
        new Date().toLocaleDateString("es-ES", { weekday:"long", day:"numeric", month:"long", year:"numeric" }).toUpperCase();

      try{
        const r = await fetch("/api/noticias");
        const datos = await r.json();

        // Al menos 1 de cada sección (la más reciente de esa sección),
        // y rellena el resto de huecos con las más recientes en general
        // hasta un máximo de TOTAL_PORTADA. Nada se duplica: es la misma
        // lista de noticias, solo elegida con este criterio.
        const porCategoria = {};
        datos.noticias.forEach(n => {
          if (!CATEGORIAS_PORTADA.includes(n.categoria)) return;
          if (!porCategoria[n.categoria]) porCategoria[n.categoria] = n;
        });
        const destacadas = Object.values(porCategoria);
        const yaIncluidas = new Set(destacadas.map(n => n.titular));
        const resto = datos.noticias.filter(n =>
          CATEGORIAS_PORTADA.includes(n.categoria) && !yaIncluidas.has(n.titular)
        );
        const extra = resto.slice(0, Math.max(0, TOTAL_PORTADA - destacadas.length));
        NOTICIAS_ACTUALES = [...destacadas, ...extra]
          .sort((a, b) => new Date(b.publicado_en) - new Date(a.publicado_en));

        document.getElementById("hora-actualizado").textContent =
          "ACTUALIZADO " + (formatearFecha(datos.actualizado) || "—");

        const grid = document.getElementById("grid");
        const heroSlot = document.getElementById("hero-slot");
        const ticker = document.getElementById("ticker-inner");

        if(!NOTICIAS_ACTUALES.length){
          grid.innerHTML = '<p class="estado">Todavía no hay noticias guardadas. Ejecuta /api/actualizar una vez (o espera al próximo cron).</p>';
          heroSlot.innerHTML = "";
          ticker.innerHTML = "<span>Sin noticias todavía</span>";
          return;
        }

        ticker.innerHTML = NOTICIAS_ACTUALES.slice(0,4).map(n => `<span>${n.titular}</span>`).join("");

        const [primera, ...resto2] = NOTICIAS_ACTUALES;
        heroSlot.innerHTML = `
          <div class="hero">
            <div class="hero-illustration">${ilustracionCategoria(primera.categoria, primera.imagen_url)}</div>
            <div class="hero-scrim"></div>
            <div class="hero-content">
              <span class="ribbon ${primera.categoria}">${ETIQUETAS[primera.categoria] || primera.categoria}</span>
              <h1 class="headline-font" style="cursor:pointer;" onclick="abrirModal(0)">${primera.titular}</h1>
              <p class="dek">${primera.resumen}</p>
              <p class="dek" style="font-size:13px; opacity:.75; margin:8px 0 14px;">${formatearFecha(primera.publicado_en)}</p>
              <div class="acciones">
                ${botonLikeHtml(primera)}
                <button class="btn-compartir" onclick="event.stopPropagation(); compartirPorId(${primera.id})">Compartir</button>
              </div>
            </div>
          </div>`;

        grid.innerHTML = resto2.map((n, i) => `
          <div class="card">
            <div class="card-img">${ilustracionCategoria(n.categoria, n.imagen_url)}</div>
            <div class="card-body">
              <span class="tag ${n.categoria}">${ETIQUETAS[n.categoria] || n.categoria}</span>
              <h3 class="headline-font">${n.titular}</h3>
              <p class="teaser">${n.resumen}</p>
              <p class="teaser" style="font-size:12px; opacity:.65;">${formatearFecha(n.publicado_en)}</p>
              <div class="acciones">
                ${botonLikeHtml(n)}
                <button class="btn-compartir" onclick="compartirPorId(${n.id})">Compartir</button>
              </div>
              <button class="leer-mas" onclick="abrirModal(${i + 1})">Leer más →</button>
            </div>
          </div>
        `).join("");

      }catch(e){
        document.getElementById("grid").innerHTML = '<p class="estado">No se pudieron cargar las noticias. Revisa que /api/noticias esté desplegado.</p>';
      }
    }

    cargar();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
